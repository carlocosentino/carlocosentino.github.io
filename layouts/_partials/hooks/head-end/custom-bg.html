{{/* Fundo do site acompanhando a variação de luminosidade da foto do herói:
     diagonal quase-preto (topo-esq) → cinza (base-dir), mapeado ao viewport */}}
<style>
  body.page-wrapper{
    background: linear-gradient(168deg,#070707 0%,#0c0d0f 34%,#131417 64%,#18191b 100%) fixed !important;
    background-size: cover !important;
    background-color: #131417 !important;
  }
  /* Cards como retângulos limpos, sem miniatura/degradê (todas as seções).
     Só oculta os placeholders SEM imagem real — preserva cards com capa (ex.: livro) */
  [class*="aspect-["][class*="bg-gradient-to-br"][class*="from-zinc"]:not(:has(img)){display:none !important}
  /* Exceção: quando há capa/imagem real (ex.: capa do livro) — exibe a MESMA capa
     da página da publicação: thumbnail limpo e centralizado, sem caixa larga */
  [class*="aspect-["][class*="from-zinc"]:has(img){display:block !important;aspect-ratio:auto !important;height:230px !important;min-height:0 !important;padding:0 !important;background:transparent !important}
  [class*="aspect-["][class*="from-zinc"]:has(img) a{display:block !important;width:100% !important;height:100% !important}
  [class*="aspect-["][class*="from-zinc"]:has(img) img{position:static !important;width:100% !important;height:100% !important;object-fit:contain !important}
  /* Mesma capa, mesmo tamanho, na página da publicação */
  .featured-image-wrapper{max-width:170px !important;max-height:245px !important;margin-top:4rem !important;margin-bottom:1.4rem !important}
  /* Coautoria: mesmo destaque para todos os autores (remove o mini-avatar exclusivo do titular) */
  .inline-flex.items-center.text-current img.rounded-full{display:none !important}
  img[alt="avatar"]{display:none !important}
  .relative.h-6.w-6.flex-shrink-0{display:none !important}
  /* Remove o card de autor (foto + minicurrículo) no rodapé de publicações/posts:
     evita repetição e dá o mesmo destaque a todos os coautores */
  .flex.pt-12.pb-4{display:none !important}
  /* Links "Ver mais / Ver todas" */
  .more-row{text-align:center;margin-top:.4rem}
  .more-link{display:inline-block;color:#9db4cc;font-weight:600;text-decoration:none;font-size:.95rem;transition:color .2s}
  .more-link:hover{color:#e8e8ea}
</style>
<script>
  // Liga o nome do coautor Fydel Marcus Rolim Mota ao seu Instagram
  document.addEventListener('DOMContentLoaded', function () {
    // Confirmação após envio do formulário (redirect ?enviado=1)
    if (/[?&]enviado=1/.test(location.search)) {
      var b = document.createElement('div');
      b.textContent = 'Mensagem enviada com sucesso. Obrigado pelo contato!';
      b.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f6f43;color:#fff;padding:.8rem 1.4rem;border-radius:10px;font-weight:600;font-size:.95rem;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.4)';
      document.body.appendChild(b);
      setTimeout(function(){ b.style.transition='opacity .6s'; b.style.opacity='0'; }, 5000);
    }
    document.querySelectorAll('div, span').forEach(function (el) {
      if (el.children.length === 0 && el.textContent.trim() === 'Fydel Marcus Rolim Mota') {
        var a = document.createElement('a');
        a.href = 'https://www.instagram.com/prof.fydelmota/';
        a.target = '_blank'; a.rel = 'noopener';
        a.textContent = el.textContent;
        a.className = 'hover:underline';
        a.style.color = 'inherit';
        el.textContent = '';
        el.appendChild(a);
      }
    });
    // Abre os anexos (PDF/links "Texto do artigo/capítulo") em nova aba
    document.querySelectorAll('a.hb-attachment-link, a[href$=".pdf"], a[href$=".docx"]').forEach(function (a) {
      a.target = '_blank';
      a.rel = 'noopener';
    });
    // O Hugo gera uma miniatura 16/9 RECORTADA da capa para os cards; troca pela
    // imagem original (featured.jpg) para mostrar a capa inteira, sem corte.
    document.querySelectorAll('img[srcset*="featured_hu"]').forEach(function (img) {
      var m = (img.getAttribute('srcset') || '').match(/(\S+\/)featured_hu_[^,\s]+/);
      if (m) {
        img.removeAttribute('srcset');
        img.removeAttribute('sizes');
        img.src = m[1] + 'featured.jpg';
      }
    });
  });
</script>
<style>
  /* Cards: só o texto, com o mínimo de fundo (sem borda/sombra) */
  [class*="bg-zinc-900/90"],[class*="bg-zinc-800/90"]{
    background: rgba(255,255,255,.025) !important;
    box-shadow: none !important;
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
  }
  [class*="bg-gray-900/50"],[class*="bg-gray-50"]{ background: transparent !important; }
  [class*="border-gray-800"],[class*="border-gray-200"]{ border-color: rgba(255,255,255,.06) !important; }
  /* Resumo COMPLETO nos cards de publicação (home e página /publication/),
     sem o corte de 3 linhas — não afeta Notícias/posts */
  [role="article"]:has(a[href*="/publication/"]) p[class*="line-clamp"]{
    -webkit-line-clamp: unset !important;
    line-clamp: unset !important;
    display: block !important;
    overflow: visible !important;
  }
  /* Remove a marca "Carlo Cosentino" do topo (o menu já tem "Início") */
  .navbar-brand{display:none !important}
  /* Seção de Contato no rodapé (padrão do site do Fredie) */
  .site-contato{position:relative;left:50%;transform:translateX(-50%);width:min(1140px,92vw);display:grid;grid-template-columns:1fr 1fr;gap:3.5rem;text-align:left;padding:1.5rem 0 2.5rem}
  .site-contato h2{font-size:1.5rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#f3f4f6;margin:0 0 .7rem}
  .site-contato .rule{height:3px;width:120px;background:#9db4cc;border:0;margin:0 0 1.6rem}
  .site-contato .firma{font-size:1.05rem;font-weight:700;color:#f3f4f6;margin:0 0 1rem}
  .site-contato p{color:#c2c9d2;line-height:1.75;margin:0 0 1rem;font-size:.97rem}
  .site-contato a{color:#9db4cc;text-decoration:none}
  .site-contato a:hover{color:#e8e8ea}
  .site-contato .wa{display:inline-flex;align-items:center;gap:.5rem;background:#1f6f43;color:#fff !important;padding:.6rem 1.1rem;border-radius:10px;font-weight:600;font-size:.92rem;margin-top:.3rem}
  .site-contato .wa:hover{background:#24814e}
  .site-contato form{display:flex;flex-direction:column;gap:.85rem}
  .site-contato label{font-weight:700;color:#e8e8ea;font-size:.88rem}
  .site-contato input,.site-contato textarea{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:.7rem .9rem;color:#f3f4f6;font-size:.95rem;font-family:inherit;width:100%}
  .site-contato textarea{min-height:120px;resize:vertical}
  .site-contato button{align-self:flex-end;background:#9db4cc;color:#0a0a0b;border:0;border-radius:10px;padding:.62rem 1.7rem;font-weight:700;font-size:.95rem;cursor:pointer;letter-spacing:.06em}
  .site-contato button:hover{background:#b6c7d8}
  @media(max-width:820px){.site-contato{grid-template-columns:1fr;gap:2rem}}
  /* Remove a linha inferior do rodapé: ícones de licença + "Made with Hugo Blox" + "Construa a sua" */
  footer .powered-by{display:none !important}
  /* Contato discreto no rodapé (versão completa fica em /contato/) */
  .site-contato-mini{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.55rem;font-size:.85rem;color:#8a93a0;padding:.3rem 0}
  .site-contato-mini a{color:#9db4cc;text-decoration:none}
  .site-contato-mini a:hover{color:#e8e8ea}
  .site-contato-mini span{color:#454c57}
  /* Botão de seção (link para canal/destino externo) */
  .section-cta{display:inline-flex;align-items:center;gap:.5rem;margin:.2rem 0 .2rem;padding:.6rem 1.2rem;border:1px solid #2c3340;border-radius:10px;color:#e8e8ea;text-decoration:none;font-weight:600;font-size:.92rem;transition:background .2s}
  .section-cta:hover{background:#161a22}
  /* Grade de últimos vídeos do YouTube */
  .yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.4rem;margin:1.8rem auto 0;max-width:980px}
  .yt-card{display:block;text-decoration:none;color:inherit;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.03);transition:transform .15s,background .2s}
  .yt-card:hover{transform:translateY(-3px);background:rgba(255,255,255,.06)}
  .yt-card__thumb{position:relative;aspect-ratio:16/9;background:#000}
  .yt-card__thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .yt-card__play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .yt-card__play svg{width:48px;height:48px;color:#fff;opacity:.92;filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))}
  .yt-card__title{padding:.7rem .8rem .9rem;font-size:.9rem;line-height:1.35;color:#dfe3ea;font-weight:600}
  /* Ícones de redes sociais (grupo de pesquisa) */
  .gp__social{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-top:1.6rem}
  .gp__social a{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border:1px solid #2c3340;border-radius:50%;color:#cdd2da;transition:background .2s,color .2s,border-color .2s}
  .gp__social a:hover{background:#161a22;color:#fff;border-color:#3a4453}
  .gp__social svg{width:21px;height:21px}
  /* Formulário isolado (página de contato / fale com o grupo) */
  .site-contato--solo{grid-template-columns:1fr !important;width:min(560px,92vw);gap:1rem}
  .site-contato--form-title{text-align:center;font-size:1.05rem;font-weight:700;color:#f3f4f6;margin:2.6rem 0 0}
  /* Cards de episódios do podcast (2 colunas, estilo linktr.ee) */
  .pod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;max-width:820px;margin:1.6rem auto 0}
  .pod-card{display:flex;align-items:center;gap:.85rem;padding:.85rem 1rem;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);text-decoration:none;color:inherit;transition:background .2s,transform .15s}
  .pod-card:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
  .pod-card__icon{flex:0 0 auto;display:inline-flex;color:#1db954}
  .pod-card__icon svg{width:30px;height:30px}
  .pod-card__body{display:flex;flex-direction:column;min-width:0}
  .pod-card__title{font-weight:600;font-size:.92rem;color:#e8eaee;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pod-card__date{font-size:.78rem;color:#8a93a0;margin-top:.2rem}
  @media(max-width:640px){.pod-grid{grid-template-columns:1fr}}
  /* Correção mobile: as grades (auto-fill/2 colunas) inflavam o container .prose
     (centralizado com align-items:center) e vazavam para a direita no celular.
     width/max-width:100% faz a grade respeitar a largura disponível. */
  .yt-grid,.pod-grid{width:100%;max-width:100%}
  /* Vídeo único em destaque na home */
  .yt-grid--single{grid-template-columns:1fr;max-width:480px}
  /* Card de podcast com capa do episódio (home) */
  .pod-card__cover{flex:0 0 auto;width:60px;height:60px;border-radius:8px;object-fit:cover;display:block;background:#000}
  .pod-card__meta{font-size:.78rem;color:#8a93a0;margin-top:.25rem}
</style>
<script>
(function(){
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  async function fetchText(url){
    var proxies=[
      function(u){return 'https://api.allorigins.win/raw?url='+encodeURIComponent(u);},
      function(u){return 'https://corsproxy.io/?url='+encodeURIComponent(u);}
    ];
    for(var i=0;i<proxies.length;i++){
      try{var r=await fetch(proxies[i](url),{cache:'no-store'});if(r.ok){var t=await r.text();if(t&&t.length>200)return t;}}catch(e){}
    }
    return null;
  }
  function ytCard(v){
    return '<a class="yt-card" href="https://www.youtube.com/watch?v='+v.id+'" target="_blank" rel="noopener">'+
      '<div class="yt-card__thumb"><img loading="lazy" src="https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg" alt="">'+
      '<span class="yt-card__play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></div>'+
      '<div class="yt-card__title">'+esc(v.title)+'</div></a>';
  }
  async function renderYT(el){
    var ch=el.dataset.ytChannel,count=parseInt(el.dataset.ytCount||'6',10),pinned=[];
    if(el.dataset.ytPinned){el.dataset.ytPinned.split('||').forEach(function(p){var k=p.split('::');if(k[0])pinned.push({id:k[0],title:k[1]||''});});}
    var xml=await fetchText('https://www.youtube.com/feeds/videos.xml?channel_id='+ch);
    if(!xml)return;
    var doc=new DOMParser().parseFromString(xml,'text/xml'),entries=doc.getElementsByTagName('entry'),vids=[];
    for(var i=0;i<entries.length;i++){
      var e=entries[i],id='',yv=e.getElementsByTagName('yt:videoId');
      if(yv.length)id=yv[0].textContent;
      if(!id){var idt=e.getElementsByTagName('id');if(idt.length){var m=idt[0].textContent.match(/video:(.+)$/);if(m)id=m[1];}}
      var tt=e.getElementsByTagName('title');
      if(id)vids.push({id:id,title:tt.length?tt[0].textContent:''});
    }
    vids=pinned.concat(vids.slice(0,count));
    var seen={},out=[];
    vids.forEach(function(v){if(!seen[v.id]){seen[v.id]=1;out.push(v);}});
    if(out.length)el.innerHTML=out.map(ytCard).join('');
  }
  function fmtDur(d){
    if(!d)return'';
    if(/^\d+$/.test(d)){var s=+d,h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+('0'+m).slice(-2):''+m)+':'+('0'+x).slice(-2);}
    return d.replace(/^00:/,'').replace(/^0(\d:)/,'$1');
  }
  var POD_SVG='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.5 17.3c-.22.36-.68.47-1.04.25-2.86-1.75-6.46-2.14-10.7-1.17-.41.09-.82-.16-.92-.57-.09-.41.16-.82.57-.92 4.64-1.06 8.62-.61 11.83 1.35.36.22.47.68.25 1.06zm1.47-3.27c-.28.45-.86.59-1.31.32-3.27-2.01-8.26-2.6-12.13-1.42-.5.15-1.04-.13-1.19-.63-.15-.51.13-1.04.63-1.19 4.42-1.34 9.92-.68 13.67 1.62.44.27.59.86.33 1.3zm.13-3.4C16.7 8.5 10.66 8.3 6.92 9.43c-.61.18-1.25-.16-1.43-.76-.18-.61.16-1.25.77-1.43 4.3-1.3 10.95-1.05 15.27 1.52.55.32.73 1.04.4 1.59-.32.55-1.04.73-1.59.4z"/></svg>';
  function podCard(e){
    var ds='';
    if(e.date){var d=new Date(e.date);if(!isNaN(d))ds=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});}
    if(e.cover){
      var meta=[ds,fmtDur(e.dur)].filter(Boolean).join(' · ');
      return '<a class="pod-card pod-card--cover" href="'+e.link+'" target="_blank" rel="noopener">'+
        (e.img?'<img class="pod-card__cover" loading="lazy" src="'+esc(e.img)+'" alt="">':'<span class="pod-card__icon">'+POD_SVG+'</span>')+
        '<span class="pod-card__body"><span class="pod-card__title">'+esc(e.title)+'</span>'+
        (meta?'<span class="pod-card__meta">'+esc(meta)+'</span>':'')+'</span></a>';
    }
    return '<a class="pod-card" href="'+e.link+'" target="_blank" rel="noopener">'+
      '<span class="pod-card__icon">'+POD_SVG+'</span>'+
      '<span class="pod-card__body"><span class="pod-card__title">'+esc(e.title)+'</span>'+(ds?'<span class="pod-card__date">'+ds+'</span>':'')+'</span></a>';
  }
  async function renderPod(el){
    var count=parseInt(el.dataset.podCount||'4',10),cover=!!el.dataset.podCover,xml=await fetchText(el.dataset.podRss);
    if(!xml)return;
    var doc=new DOMParser().parseFromString(xml,'text/xml');
    var chImg='',ci=doc.getElementsByTagName('itunes:image');if(ci.length)chImg=ci[0].getAttribute('href')||'';
    if(!chImg){var u=doc.querySelector('channel>image>url');if(u)chImg=u.textContent.trim();}
    var items=doc.getElementsByTagName('item'),out=[];
    for(var i=0;i<items.length&&out.length<count;i++){
      var it=items[i],tt=it.getElementsByTagName('title'),ll=it.getElementsByTagName('link'),pp=it.getElementsByTagName('pubDate');
      var im=it.getElementsByTagName('itunes:image'),img=(im.length&&im[0].getAttribute('href'))||chImg;
      var du=it.getElementsByTagName('itunes:duration'),dur=du.length?du[0].textContent.trim():'';
      out.push({title:tt.length?tt[0].textContent:'',link:ll.length?ll[0].textContent.trim():'#',date:pp.length?pp[0].textContent:'',img:img,dur:dur,cover:cover});
    }
    if(out.length)el.innerHTML=out.map(podCard).join('');
  }
  function pinBook(){
    if(!/^\/publication\/?$/.test(location.pathname)) return;
    var slug='/publication/2018-direito-do-trabalho-tecnologias-da-informacao-e-da-comunicacao-impactos-nas-rela/';
    var a=document.querySelector('a[href*="'+slug+'"]');
    if(!a) return;
    var card=a, grid=null;
    while(card&&card.parentElement){
      var c=card.parentElement.className||'';
      if(/grid-cols/.test(c)){grid=card.parentElement;break;}
      card=card.parentElement;
    }
    if(grid&&card&&grid.firstElementChild!==card){grid.insertBefore(card,grid.firstElementChild);}
  }
  document.addEventListener('DOMContentLoaded',function(){
    document.querySelectorAll('[data-yt-channel]').forEach(renderYT);
    document.querySelectorAll('[data-pod-rss]').forEach(renderPod);
    pinBook();
  });
})();
</script>
