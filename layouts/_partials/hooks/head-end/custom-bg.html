{{/* Fundo do site acompanhando a variação de luminosidade da foto do herói:
     diagonal quase-preto (topo-esq) → cinza (base-dir), mapeado ao viewport */}}
<style>
  body.page-wrapper{
    background: linear-gradient(168deg,#070707 0%,#0c0d0f 34%,#131417 64%,#18191b 100%) fixed !important;
    background-size: cover !important;
    background-color: #131417 !important;
  }
  /* Cards como retângulos limpos, sem miniatura/degradê (todas as seções) */
  [class*="aspect-["][class*="bg-gradient-to-br"][class*="from-zinc"]{display:none !important}
  /* Exceção: quando há capa/imagem real (ex.: capa do livro), dar destaque —
     enquadra na proporção real da capa (retrato), grande e inteira, sem distorção */
  [class*="aspect-["][class*="from-zinc"]:has(img){display:block !important;aspect-ratio:347/500 !important;background:#0c0d0f !important}
  [class*="aspect-["][class*="from-zinc"]:has(img) img{object-fit:cover !important}
  /* Coautoria: mesmo destaque para todos os autores (remove o mini-avatar exclusivo do titular) */
  .inline-flex.items-center.text-current img.rounded-full{display:none !important}
  img[alt="avatar"]{display:none !important}
  .relative.h-6.w-6.flex-shrink-0{display:none !important}
  /* Remove o card de autor (foto + minicurrículo) no rodapé de publicações/posts:
     evita repetição e dá o mesmo destaque a todos os coautores */
  .flex.pt-12.pb-4{display:none !important}
  /* Links "Ver mais / Ver todas" */
  .more-row{text-align:center;margin-top:.4rem}
  .more-link{display:inline-block;color:#9db4cc;font-weight:600;text-decoration:none;font-size:.95rem;transition:color .2s}
  .more-link:hover{color:#e8e8ea}
</style>
<script>
  // Liga o nome do coautor Fydel Marcus Rolim Mota ao seu Instagram
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('div, span').forEach(function (el) {
      if (el.children.length === 0 && el.textContent.trim() === 'Fydel Marcus Rolim Mota') {
        var a = document.createElement('a');
        a.href = 'https://www.instagram.com/prof.fydelmota/';
        a.target = '_blank'; a.rel = 'noopener';
        a.textContent = el.textContent;
        a.className = 'hover:underline';
        a.style.color = 'inherit';
        el.textContent = '';
        el.appendChild(a);
      }
    });
  });
</script>
<style>
  /* Cards: só o texto, com o mínimo de fundo (sem borda/sombra) */
  [class*="bg-zinc-900/90"],[class*="bg-zinc-800/90"]{
    background: rgba(255,255,255,.025) !important;
    box-shadow: none !important;
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
  }
  [class*="bg-gray-900/50"],[class*="bg-gray-50"]{ background: transparent !important; }
  [class*="border-gray-800"],[class*="border-gray-200"]{ border-color: rgba(255,255,255,.06) !important; }
</style>
